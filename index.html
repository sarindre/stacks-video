<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Stacks Video</title>
    <script>
      // Apply the saved theme before first paint so a light-theme user never sees a dark flash.
      // Keep in step with src/lib/theme.ts.
      try {
        var s = JSON.parse(localStorage.getItem('shelfkeeper.settings.v1') || '{}')
        var pref = s.theme === 'dark' || s.theme === 'light' ? s.theme : 'system'
        var light = pref === 'light' || (pref === 'system' && matchMedia('(prefers-color-scheme: light)').matches)
        document.documentElement.dataset.theme = light ? 'light' : 'dark'
        document.documentElement.style.colorScheme = light ? 'light' : 'dark'
      } catch (e) {}
    </script>
    <meta name="description" content="Stacks Video: a private tracker for your DVDs, games, records and books. Be kind, rewind. Everything stays on your device." />
    <meta name="theme-color" content="#151311" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
    <link rel="icon" type="image/png" sizes="48x48" href="./icons/favicon-48.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
